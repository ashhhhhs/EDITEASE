<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px 20px;background:var(--surface-base);font-family:var(--font-sans)}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border-default);background:var(--surface-panel);color:var(--text-primary)}
  .primary{background:#58a6ff;color:#fff;border-color:transparent}
  .success{background:#238636;color:#fff;border-color:transparent}
  .danger{background:#da3633;color:#fff;border-color:transparent}
  .ghost{background:transparent;color:var(--text-secondary);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:10px 22px}
  .launch{background:var(--text-primary);color:var(--surface-base);border-radius:999px;padding:10px 22px;border:0;font-weight:600}
  .lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px}
</style></head><body>
<div class="lbl">App buttons — .btn / .btn-primary / .btn-success / .btn-danger</div>
<div class="row">
  <button class="btn">Default</button>
  <button class="btn primary">Primary action</button>
  <button class="btn success">Approve</button>
  <button class="btn danger">Flag</button>
  <button class="btn" disabled style="opacity:.5">Disabled</button>
</div>
<div class="lbl">Marketing pills — .btn-launch / .btn-ghost</div>
<div class="row">
  <button class="launch">Get Started →</button>
  <button class="ghost">See how it works ↓</button>
</div>
</body></html>
