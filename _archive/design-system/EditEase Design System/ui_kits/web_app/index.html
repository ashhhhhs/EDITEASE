<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>EditEase — Web App UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="landing-v2.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; }
html, body { margin:0; background:var(--surface-base); color:var(--text-primary); font-family:var(--font-sans); }

/* ── Mode switcher ─────────────────────────────────────────── */
.mode-bar { position: fixed; bottom: 16px; right: 16px; z-index: 50; display:flex; gap:4px; padding:5px; background:rgba(22,27,34,.85); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); border-radius:999px; box-shadow:0 12px 32px rgba(0,0,0,.4); font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
.mode-bar button { background:transparent; color:var(--text-secondary); border:0; padding:5px 12px; border-radius:999px; cursor:pointer; font:inherit; text-transform:inherit; letter-spacing:inherit; }
.mode-bar button.active { background:rgba(88,166,255,.14); color:#58a6ff; border:1px solid rgba(88,166,255,.22); }

/* ── Atmosphere shared ─────────────────────────────────────── */
.atmosphere { position:fixed; border-radius:50%; filter:blur(110px); pointer-events:none; z-index:0; }
.atmosphere.a { width:520px; height:520px; top:-160px; left:-180px; background:rgba(88,166,255,.30); }
.atmosphere.b { width:480px; height:480px; right:-100px; bottom:-200px; background:rgba(163,113,247,.22); }
.atmosphere.c { width:380px; height:380px; left:50%; top:30%; background:rgba(35,134,54,.16); }
.grid-overlay { position:fixed; inset:0; background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px); background-size:64px 64px; mask-image:radial-gradient(circle at center,black 30%,transparent 88%); pointer-events:none; z-index:0; }

/* ── Generic ───────────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:8px; background:var(--surface-panel); color:var(--text-primary); border:1px solid var(--border-default); font:inherit; font-size:14px; font-weight:500; cursor:pointer; transition:all .2s var(--ease-cinematic); }
.btn:hover { border-color:var(--border-strong); background:rgba(255,255,255,.04); }
.btn.primary { background:var(--accent); color:#fff; border-color:transparent; }
.btn.primary:hover { background:#79b8ff; }
.btn.ghost { background:transparent; border-color:rgba(255,255,255,.08); }
.btn.block { display:flex; width:100%; justify-content:center; padding:12px; }
.btn.ghost-bordered { background:transparent; border:1px solid rgba(255,255,255,.12); }
.btn-link { background:transparent; border:0; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.badge { display:inline-flex; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; text-transform:capitalize; border:1px solid; }
.badge.info { background:rgba(88,166,255,.10); color:#58a6ff; border-color:rgba(88,166,255,.22); }
.mono-caps { font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-muted); }

/* ═══════════════ LANDING ═══════════════ */
.landing { position:relative; min-height:100vh; }
.lp-nav { position:relative; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:20px 40px; backdrop-filter:blur(12px); }
.lp-logo { font-size:20px; font-weight:700; letter-spacing:-.02em; color:var(--text-primary); text-decoration:none; }
.lp-links { display:flex; align-items:center; gap:28px; }
.lp-nav-link { color:var(--text-secondary); text-decoration:none; font-size:14px; font-weight:500; }
.lp-nav-link:hover { color:var(--text-primary); }
.btn-launch { background:var(--text-primary); color:var(--surface-base); padding:10px 22px; border-radius:999px; text-decoration:none; font-weight:600; font-size:14px; border:0; cursor:pointer; display:inline-flex; align-items:center; }
.btn-launch.lg { padding:14px 28px; font-size:16px; }
.btn-ghost { color:var(--text-secondary); border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:13px 26px; text-decoration:none; font-size:15px; }
.hero { position:relative; z-index:5; max-width:1240px; margin:0 auto; padding:60px 40px 100px; }
.hero-grid { display:grid; grid-template-columns:1fr 1.05fr; gap:56px; align-items:center; }
.hero-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; background:rgba(88,166,255,.08); border:1px solid rgba(88,166,255,.18); color:#58a6ff; margin-bottom:24px; }
.hero-dot { width:6px; height:6px; border-radius:50%; background:#58a6ff; box-shadow:0 0 12px #58a6ff; }
.display-h1 { font-size:clamp(3rem,6vw,5.5rem); font-weight:700; letter-spacing:-.03em; line-height:1; margin:0 0 24px; }
.body-large { font-size:1.15rem; line-height:1.7; color:var(--text-secondary); max-width:520px; margin:0 0 32px; }
.hero-actions { display:flex; align-items:center; gap:16px; margin-bottom:48px; }
.hero-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:560px; }
.hero-metric { padding:14px; background:rgba(22,27,34,.68); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.06); border-radius:14px; }
.hero-metric b { display:block; font-size:18px; font-weight:600; }
.hero-metric em { display:block; font-style:normal; font-size:11px; color:var(--text-muted); margin-top:4px; line-height:1.4; }
.hero-visual { position:relative; perspective:1200px; }
.hero-glow { position:absolute; inset:-30px; background:radial-gradient(circle at 30% 30%,rgba(88,166,255,.25),transparent 60%); filter:blur(40px); }
.hero-device { position:relative; background:rgba(13,17,23,.92); border:1px solid rgba(255,255,255,.08); border-radius:16px; box-shadow:0 40px 120px rgba(0,0,0,.46); transform:rotateY(-6deg) rotateX(2deg); transform-style:preserve-3d; }
.hero-bar { display:flex; align-items:center; gap:6px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.06); }
.dot { width:10px; height:10px; border-radius:50%; }
.hero-bar-title { margin-left:14px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:.04em; }
.hero-screen { display:grid; grid-template-columns:48px 1fr; grid-template-rows:1fr auto; gap:14px; padding:18px; min-height:340px; }
.hero-sb { display:flex; flex-direction:column; gap:10px; }
.hero-sb span { display:block; height:6px; border-radius:3px; background:rgba(255,255,255,.06); }
.hero-sb .ln { width:100%; }
.hero-sb .ln.active { background:#58a6ff; }
.hero-sb .ln.short { width:60%; }
.hero-shots { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; grid-column:2; }
.shot { position:relative; aspect-ratio:16/10; background:var(--bg); border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,.06); padding:10px; display:flex; flex-direction:column; justify-content:flex-end; }
.shot.wide { grid-column:span 2; aspect-ratio:auto; min-height:160px; box-shadow:inset 0 0 0 1px var(--tone); }
.shot::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6)); }
.shot strong { position:relative; z-index:1; font-size:13px; color:var(--text-primary); font-weight:600; }
.shot-tag { position:relative; z-index:1; font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-secondary); margin-bottom:4px; }
.hero-tl { position:relative; grid-column:1/-1; height:24px; margin-top:6px; }
.tl-track { position:absolute; inset:9px 0; background:rgba(255,255,255,.06); border-radius:2px; }
.tl-prog { position:absolute; left:0; top:9px; width:42%; height:6px; background:linear-gradient(90deg,#58a6ff,#a371f7); border-radius:2px; }
.tl-mk { position:absolute; top:6px; width:2px; height:12px; background:rgba(255,255,255,.4); }
.tl-mk.a { left:18%; } .tl-mk.b { left:42%; background:#58a6ff; height:18px; top:3px; } .tl-mk.c { left:72%; }

.lp-section { position:relative; z-index:5; max-width:1240px; margin:0 auto; padding:80px 40px; }
.kicker { text-align:center; margin-bottom:48px; }
.kicker .mono-caps { display:inline-block; padding:6px 14px; border:1px solid rgba(255,255,255,.08); border-radius:999px; background:rgba(255,255,255,.02); }
.kicker p { margin:14px 0 0; font-size:18px; color:var(--text-secondary); max-width:540px; margin-inline:auto; }
.steps { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
.step { padding:24px 20px; background:rgba(22,27,34,.6); border:1px solid var(--border-subtle); border-radius:16px; }
.step-num { font-family:var(--font-mono); font-size:32px; font-weight:600; color:#58a6ff; opacity:.5; line-height:1; }
.step-label { font-size:18px; font-weight:600; margin:14px 0 6px; }
.step-body { font-size:14px; color:var(--text-secondary); line-height:1.6; }
.marquee { position:relative; z-index:5; overflow:hidden; padding:32px 0; border-top:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle); }
.marquee-track { display:flex; gap:48px; white-space:nowrap; animation:scroll 35s linear infinite; }
.marquee-track span { font-family:var(--font-mono); font-size:14px; letter-spacing:.12em; color:var(--text-muted); }
@keyframes scroll { to { transform:translateX(-50%); } }

/* ═══════════════ WORKSPACE ═══════════════ */
.ws-shell { display:flex; min-height:100vh; position:relative; }
.ws-shell .ambient { position:fixed; border-radius:50%; filter:blur(110px); pointer-events:none; z-index:0; }
.ws-shell .ambient.a { width:480px; height:480px; top:-180px; left:-220px; background:rgba(88,166,255,.18); }
.ws-shell .ambient.b { width:380px; height:380px; right:-100px; bottom:-150px; background:rgba(163,113,247,.14); }
.ws-sidebar { position:relative; z-index:5; width:260px; padding:18px 14px; background:rgba(22,27,34,.72); backdrop-filter:blur(18px); border-right:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; }
.ws-logo { display:flex; align-items:center; gap:12px; padding:8px 12px; text-decoration:none; color:var(--text-primary); margin-bottom:24px; }
.ws-logo-mark { width:38px; height:38px; border-radius:12px; background:rgba(88,166,255,.10); border:1px solid rgba(88,166,255,.20); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ws-logo-copy { display:flex; flex-direction:column; }
.ws-logo-copy b { font-size:15px; font-weight:600; }
.ws-logo-copy em { font-style:normal; font-size:11px; color:var(--text-muted); }
.ws-nav { flex:1; display:flex; flex-direction:column; gap:4px; }
.ws-section-label { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-muted); padding:0 12px 8px; margin-top:8px; }
.ws-nav-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; background:transparent; border:1px solid transparent; color:var(--text-secondary); font:inherit; font-size:14px; font-weight:500; cursor:pointer; text-align:left; transition:all .2s var(--ease-cinematic); }
.ws-nav-item:hover { color:var(--text-primary); background:rgba(255,255,255,.03); }
.ws-nav-item.active { color:var(--text-primary); background:linear-gradient(90deg,rgba(88,166,255,.14),rgba(88,166,255,.03)); border-color:rgba(88,166,255,.22); }
.ws-sb-footer { padding-top:14px; border-top:1px solid var(--border-subtle); }
.ws-account { display:flex; align-items:center; gap:10px; padding:10px; background:rgba(255,255,255,.02); border:1px solid var(--border-subtle); border-radius:12px; }
.ws-avatar { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,#58a6ff,#a371f7); display:flex; align-items:center; justify-content:center; font-weight:600; color:#fff; }
.ws-account-copy { display:flex; flex-direction:column; }
.ws-account-copy b { font-size:13px; }
.ws-account-copy em { font-style:normal; font-size:11px; color:var(--text-muted); text-transform:capitalize; }

.ws-main { flex:1; position:relative; z-index:5; min-width:0; }
.ws-topbar { display:flex; justify-content:space-between; align-items:flex-end; padding:28px 40px 20px; border-bottom:1px solid var(--border-subtle); }
.ws-tb-eyebrow { font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-muted); display:block; }
.ws-tb-title { font-size:26px; font-weight:600; letter-spacing:-.02em; display:block; margin:6px 0 4px; }
.ws-tb-sub { font-size:13px; color:var(--text-secondary); display:block; }
.ws-tb-actions { display:flex; align-items:center; gap:10px; }
.ws-content { padding:32px 40px 60px; }

/* dashboard */
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.stat-card { position:relative; padding:20px; background:var(--surface-panel); border:1px solid var(--border-subtle); border-radius:14px; overflow:hidden; }
.stat-card .strip { position:absolute; top:0; left:0; right:0; height:2px; background:var(--strip); }
.stat-lbl { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); font-weight:600; }
.stat-v { font-size:36px; font-weight:700; line-height:1.1; margin:8px 0 4px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.stat-sub { font-size:12px; color:var(--text-secondary); }
.panel-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:20px; }
.panel { padding:20px 24px; background:var(--surface-panel); border:1px solid var(--border-subtle); border-radius:16px; }
.panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.panel-head b { font-size:16px; }
.panel-head em { font-style:normal; display:block; font-size:12px; color:var(--text-secondary); margin-top:2px; }
.activity { display:flex; flex-direction:column; }
.activity-row { display:grid; grid-template-columns:auto auto 1fr auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--border-subtle); font-size:13px; }
.activity-row:last-child { border:0; }
.activity-row .dot { width:6px; height:6px; }
.activity-row .tag { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:4px; border:1px solid; }
.activity-row .msg { color:var(--text-primary); }
.activity-row .when { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
.sys-list { display:flex; flex-direction:column; gap:10px; }
.sys-row { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:10px 12px; background:rgba(255,255,255,.02); border:1px solid var(--border-subtle); border-radius:10px; font-size:13px; }
.sys-row .dot { width:8px; height:8px; }
.sys-row em { font-style:normal; font-size:11px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em; }
.dot.pulse { box-shadow:0 0 0 0 currentColor; animation:pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow:0 0 0 6px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }

/* review */
.filter-bar { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
.search { flex:0 1 320px; display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface-base); border:1px solid var(--border-subtle); border-radius:10px; }
.search input { flex:1; background:transparent; border:0; color:var(--text-primary); font:inherit; font-size:14px; outline:none; }
.chips { display:flex; gap:6px; }
.chip { padding:7px 14px; border-radius:999px; background:transparent; border:1px solid var(--border-subtle); color:var(--text-secondary); font:inherit; font-size:13px; cursor:pointer; }
.chip.active { background:rgba(88,166,255,.10); border-color:rgba(88,166,255,.30); color:#58a6ff; }
.clip-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.clip { position:relative; aspect-ratio:16/9; border-radius:10px; border:1px solid var(--border-subtle); overflow:hidden; }
.clip:hover { border-color:#58a6ff; box-shadow:0 0 0 1px #58a6ff; }
.clip-bar { position:absolute; top:0; left:0; right:0; height:2px; background:rgba(255,255,255,.16); }
.clip-actions { position:absolute; top:8px; right:8px; display:flex; gap:6px; opacity:0; transition:opacity .2s; }
.clip:hover .clip-actions { opacity:1; }
.kbd { width:28px; height:28px; border-radius:7px; border:0; background:rgba(13,17,23,.85); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.kbd-good { background:rgba(35,134,54,.78); }
.kbd-bad { background:rgba(218,54,51,.78); }
.clip-badge { position:absolute; left:10px; bottom:10px; padding:3px 9px; border-radius:999px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.06em; }
.tc { position:absolute; right:10px; bottom:10px; font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,.7); background:rgba(0,0,0,.5); padding:2px 6px; border-radius:4px; }

/* uploads */
.dropzone { padding:80px 40px; text-align:center; background:rgba(255,255,255,.01); border:1px dashed var(--border-subtle); border-radius:16px; display:flex; flex-direction:column; align-items:center; }
.dz-icon { width:72px; height:72px; border-radius:20px; background:rgba(88,166,255,.10); display:flex; align-items:center; justify-content:center; margin-bottom:20px; }
.dropzone h3 { font-size:22px; margin:0 0 8px; }
.dropzone p { color:var(--text-secondary); margin:0 0 24px; max-width:420px; }
.dz-meta { margin-top:20px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }

/* library */
.folders { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.folder { padding:18px; background:var(--surface-panel); border:1px solid var(--border-subtle); border-radius:14px; }
.f-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.f-tag { padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid; }
.f-thumbs { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-bottom:12px; }
.f-thumb { aspect-ratio:16/9; border-radius:6px; border:1px solid var(--border-subtle); }
.f-meta { font-size:12px; color:var(--text-secondary); }

/* ═══════════════ AUTH ═══════════════ */
.auth-shell { position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.auth-split { position:relative; z-index:5; display:grid; grid-template-columns:1fr 1fr; gap:0; max-width:980px; width:100%; background:rgba(22,27,34,.72); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.06); border-radius:24px; box-shadow:0 24px 60px rgba(0,0,0,.40); overflow:hidden; }
.auth-aside { padding:48px 40px; background:linear-gradient(135deg,rgba(88,166,255,.06),rgba(163,113,247,.04)); display:flex; flex-direction:column; justify-content:space-between; min-height:520px; border-right:1px solid var(--border-subtle); }
.auth-logo { display:flex; align-items:center; gap:12px; font-size:18px; font-weight:600; }
.auth-headline { font-size:32px; font-weight:700; letter-spacing:-.02em; line-height:1.1; margin:0 0 12px; }
.auth-lede { font-size:15px; color:var(--text-secondary); margin:0 0 32px; line-height:1.6; }
.auth-bullets { display:flex; flex-direction:column; gap:12px; }
.auth-bullets div { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text-primary); }
.auth-card { padding:48px 40px; }
.auth-eyebrow { display:inline-block; padding:4px 10px; background:rgba(88,166,255,.08); border:1px solid rgba(88,166,255,.18); border-radius:999px; color:#58a6ff; margin-bottom:16px; }
.auth-title { font-size:30px; font-weight:600; letter-spacing:-.02em; margin:0 0 6px; }
.auth-sub { font-size:14px; color:var(--text-secondary); margin:0 0 28px; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:6px; }
.field input { width:100%; padding:11px 14px; background:var(--surface-base); border:1px solid var(--border-subtle); color:var(--text-primary); border-radius:8px; font:inherit; outline:none; }
.field input:focus { border-color:#58a6ff; box-shadow:var(--focus-ring); }
.field-row { display:flex; justify-content:space-between; align-items:center; margin:10px 0 18px; font-size:13px; }
.checky { display:flex; align-items:center; gap:8px; color:var(--text-secondary); }
.link { color:#58a6ff; text-decoration:none; font-size:13px; }
.divider { display:flex; align-items:center; gap:10px; margin:18px 0; font-size:11px; color:var(--text-muted); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border-subtle); }
.auth-foot { text-align:center; margin-top:18px; font-size:13px; color:var(--text-secondary); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Workspace.jsx"></script>
<script type="text/babel" src="Landing.jsx"></script>
<script type="text/babel" src="Auth.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [mode, setMode] = useState('landing');
  return (
    <>
      <div className="mode-bar">
        <button className={mode==='landing'?'active':''} onClick={()=>setMode('landing')}>Landing</button>
        <button className={mode==='auth'?'active':''} onClick={()=>setMode('auth')}>Sign in</button>
        <button className={mode==='workspace'?'active':''} onClick={()=>setMode('workspace')}>Workspace</button>
      </div>
      {mode==='landing' && <Landing/>}
      {mode==='auth' && <Auth onSignIn={()=>setMode('workspace')}/>}
      {mode==='workspace' && <Workspace/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
