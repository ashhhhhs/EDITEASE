<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-base);font-family:var(--font-sans);color:var(--text-primary)}
  .glow{height:110px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:radial-gradient(circle at 20% 20%,rgba(88,166,255,.45),transparent 38%),radial-gradient(circle at 75% 60%,rgba(163,113,247,.40),transparent 35%),#0d1117;margin-bottom:14px}
  .row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .sw{border-radius:10px;padding:14px;border:1px solid var(--border-subtle)}
  .name{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .lbl{font-weight:600;font-size:14px;margin-bottom:4px}
  .hex{font-family:var(--font-mono);font-size:12px}
</style></head><body>
<div class="glow"></div>
<div class="row">
  <div class="sw"><div class="lbl" style="color:#a371f7">Marketing purple</div><div class="name">--purple (gradient pair)</div><div class="hex" style="color:#a371f7">#a371f7</div></div>
  <div class="sw"><div class="lbl" style="color:#58a6ff">Accent (paired)</div><div class="name">--accent</div><div class="hex" style="color:#58a6ff">#58a6ff</div></div>
</div>
</body></html>
