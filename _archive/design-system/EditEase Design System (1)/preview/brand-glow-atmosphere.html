<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:0;background:#0d1117;height:100vh;font-family:var(--font-sans);color:var(--text-primary);position:relative;overflow:hidden}
  .a,.b,.c{position:absolute;border-radius:999px;filter:blur(90px);pointer-events:none}
  .a{width:320px;height:320px;top:-90px;left:-110px;background:rgba(88,166,255,.30)}
  .b{width:260px;height:260px;right:8%;bottom:-40px;background:rgba(163,113,247,.24)}
  .c{width:200px;height:200px;top:30%;left:45%;background:rgba(35,134,54,.16)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(circle at center,black 30%,transparent 88%)}
  .lbl{position:relative;padding:18px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted)}
</style></head><body>
<div class="a"></div><div class="b"></div><div class="c"></div><div class="grid"></div>
<div class="lbl">Atmosphere blobs · 90 px blur · accent + purple + success tints<br>Grid 60 px · masked center-out</div>
</body></html>
