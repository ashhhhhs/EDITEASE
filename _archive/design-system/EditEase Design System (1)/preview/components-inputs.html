<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px 20px;background:var(--surface-base);font-family:var(--font-sans);color:var(--text-primary)}
  .grp{margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:8px;color:var(--text-secondary)}
  input{width:100%;padding:10px 12px;background:var(--surface-base);border:1px solid var(--border-subtle);color:var(--text-primary);border-radius:8px;font:inherit;outline:none}
  input.focused{border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,.30)}
  .err{color:#da3633;font-size:13px;background:rgba(218,54,51,.10);padding:8px 12px;border-radius:6px;border:1px solid rgba(218,54,51,.20);display:flex;align-items:center;gap:8px}
</style></head><body>
<div class="grp"><label>Email</label><input value="jane@example.com"></div>
<div class="grp"><label>Password (focused)</label><input class="focused" type="password" value="••••••••"></div>
<div class="err">⚠ Invalid credentials. Check your email and try again.</div>
</body></html>
