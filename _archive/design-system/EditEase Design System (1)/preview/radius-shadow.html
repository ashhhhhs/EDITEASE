<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--surface-base);color:var(--text-primary);font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .tile{background:var(--surface-panel);border:1px solid var(--border-subtle);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:96px}
  .name{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
</style></head><body>
<div class="row">
  <div class="tile" style="border-radius:4px"><div class="name">--radius-sm</div><div class="v">4 px</div></div>
  <div class="tile" style="border-radius:8px"><div class="name">--radius-md</div><div class="v">8 px</div></div>
  <div class="tile" style="border-radius:12px"><div class="name">--radius-lg</div><div class="v">12 px</div></div>
  <div class="tile" style="border-radius:16px"><div class="name">--radius-xl</div><div class="v">16 px</div></div>
</div>
<div class="row">
  <div class="tile" style="border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.10)"><div class="name">--shadow-card</div><div class="v">0 4px 12px /.10</div></div>
  <div class="tile" style="border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.20)"><div class="name">--shadow-hover</div><div class="v">0 8px 24px /.20</div></div>
  <div class="tile" style="border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.30)"><div class="name">--shadow-modal</div><div class="v">0 16px 48px /.30</div></div>
  <div class="tile" style="border-radius:12px;box-shadow:0 0 0 3px rgba(88,166,255,.30)"><div class="name">--focus-ring</div><div class="v">0 0 0 3px accent .30</div></div>
</div>
</body></html>
