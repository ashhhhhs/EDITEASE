<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-base);font-family:var(--font-sans);color:var(--text-primary)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sw{border-radius:10px;border:1px solid var(--border-subtle);padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:80px}
  .name{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .hex{font-family:var(--font-mono);font-size:13px;color:var(--text-primary)}
  .lbl{font-size:13px;font-weight:600;color:var(--text-primary)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#0d1117">
    <div class="lbl">Surface base</div><div><div class="name">--surface-base</div><div class="hex">#0d1117</div></div></div>
  <div class="sw" style="background:#161b22">
    <div class="lbl">Surface panel</div><div><div class="name">--surface-panel</div><div class="hex">#161b22</div></div></div>
  <div class="sw" style="background:#21262d">
    <div class="lbl">Surface elevated</div><div><div class="name">--surface-elevated</div><div class="hex">#21262d</div></div></div>
</div>
</body></html>
