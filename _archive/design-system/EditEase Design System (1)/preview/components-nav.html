<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:radial-gradient(circle at 20% 0%,rgba(88,166,255,.12),transparent 30%),var(--surface-base);font-family:var(--font-sans);color:var(--text-primary)}
  .nav{background:rgba(22,27,34,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:18px 14px;width:260px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
  .lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);padding:0 12px 6px}
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:4px;color:var(--text-secondary);font-size:14px;font-weight:500;border:1px solid transparent}
  .item.active{color:var(--text-primary);background:linear-gradient(90deg,rgba(88,166,255,.14),rgba(88,166,255,.04));border-color:rgba(88,166,255,.22)}
  .ico{width:14px;height:14px;border-radius:3px;background:currentColor;opacity:.7}
</style></head><body>
<div class="nav">
  <div class="lbl">Workspace</div>
  <div class="item active"><span class="ico" style="color:#58a6ff"></span>Dashboard</div>
  <div class="item"><span class="ico"></span>Review Queue</div>
  <div class="item"><span class="ico"></span>Uploads</div>
  <div class="item"><span class="ico"></span>Organized Videos</div>
</div>
</body></html>
