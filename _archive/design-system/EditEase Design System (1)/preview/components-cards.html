<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--surface-base);color:var(--text-primary);font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{background:var(--surface-panel);border:1px solid var(--border-subtle);border-radius:12px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.10);position:relative;overflow:hidden}
  .accent-strip{position:absolute;top:0;left:0;right:0;height:2px;background:#58a6ff}
  .glass{background:rgba(22,27,34,.68);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
  h3{font-size:16px;margin:0 0 6px}p{margin:0;font-size:13px;color:var(--text-secondary);line-height:1.6}
  .lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px}
</style></head><body>
<div class="row">
  <div class="panel"><div class="accent-strip"></div><div class="lbl">Bento card · accent strip</div><h3>Pending review</h3><p>Clips waiting on a human signal before export.</p></div>
  <div class="glass"><div class="lbl">Glass panel · workspace</div><h3>Review queue</h3><p>Backdrop-filter blur 16, 6 % white border, 24 px radius.</p></div>
</div>
</body></html>
