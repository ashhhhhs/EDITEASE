<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--surface-base);color:var(--text-primary);font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{background:var(--surface-panel);border:1px solid var(--border-subtle);border-radius:12px;padding:20px;position:relative;overflow:hidden}
  .strip{position:absolute;inset:0 0 auto 0;height:2px}
  .lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600;margin-bottom:4px}
  .v{font-size:38px;font-weight:700;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums}
  .meta{font-size:12px;color:var(--text-secondary)}
</style></head><body>
<div class="row">
  <div class="card"><div class="strip" style="background:#58a6ff"></div><div class="lbl">✂ Clips Extracted</div><div class="v" style="color:#58a6ff">2,914</div><div class="meta">from 124 source videos</div></div>
  <div class="card"><div class="strip" style="background:#d29922"></div><div class="lbl">☑ Pending Review</div><div class="v" style="color:#d29922">86</div><div class="meta">awaiting human signal</div></div>
  <div class="card"><div class="strip" style="background:#238636"></div><div class="lbl">⚙ Organized</div><div class="v" style="color:#3fb950">1,602</div><div class="meta">+ 38 duplicates linked</div></div>
</div>
</body></html>
