<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px 20px;background:var(--surface-base);color:var(--text-primary);font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:12px;padding:6px 0}
  .bar{background:#58a6ff;height:18px;border-radius:3px}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);width:78px}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-left:auto}
</style></head><body>
<div class="row"><div class="name">--space-4</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
<div class="row"><div class="name">--space-8</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
<div class="row"><div class="name">--space-12</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
<div class="row"><div class="name">--space-16</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
<div class="row"><div class="name">--space-24</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
<div class="row"><div class="name">--space-32</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
<div class="row"><div class="name">--space-40</div><div class="bar" style="width:40px"></div><div class="px">40 px</div></div>
<div class="row"><div class="name">--space-64</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
</body></html>
