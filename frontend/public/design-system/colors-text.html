<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-panel);font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sw{border-radius:10px;padding:18px 16px;border:1px solid var(--border-subtle);background:var(--surface-base)}
  .text{font-size:18px;font-weight:600;margin-bottom:10px}
  .name{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .hex{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);margin-top:2px}
</style></head><body>
<div class="row">
  <div class="sw"><div class="text" style="color:#c9d1d9">Primary text</div><div class="name">--text-primary</div><div class="hex">#c9d1d9</div></div>
  <div class="sw"><div class="text" style="color:#8b949e">Secondary text</div><div class="name">--text-secondary</div><div class="hex">#8b949e</div></div>
  <div class="sw"><div class="text" style="color:#6e7681">Muted text</div><div class="name">--text-muted</div><div class="hex">#6e7681</div></div>
</div>
</body></html>
