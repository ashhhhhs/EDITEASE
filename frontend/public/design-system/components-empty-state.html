<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--surface-base);font-family:var(--font-sans);color:var(--text-primary)}
  .es{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 24px;background:rgba(255,255,255,.01);border:1px dashed var(--border-subtle);border-radius:12px}
  .ic{width:56px;height:56px;border-radius:50%;background:var(--surface-panel);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.10);color:var(--text-secondary);font-size:24px}
  h3{margin:0 0 6px;font-size:18px}p{margin:0 0 14px;color:var(--text-secondary);font-size:14px;max-width:340px;line-height:1.6}
  .btn{background:#58a6ff;color:#fff;border:0;padding:8px 16px;border-radius:8px;font-weight:500;font-size:14px}
</style></head><body>
<div class="es">
  <div class="ic">▤</div>
  <h3>No footage yet</h3>
  <p>Upload your first video and let the AI organise it into categories automatically.</p>
  <button class="btn">Upload Footage</button>
</div>
</body></html>
