<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>body{margin:0;padding:20px;background:var(--surface-base);color:var(--text-primary);font-family:var(--font-sans)}
  .row{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border-subtle)}
  .row:last-child{border:0}
  .name{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);width:120px;flex-shrink:0}
  .meta{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
</style></head><body>
<div class="row"><div class="name">h1 / page</div><div style="font-size:28px;font-weight:600;letter-spacing:-.02em">Page title h1</div><div class="meta">28 / 600</div></div>
<div class="row"><div class="name">h2 / section</div><div style="font-size:20px;font-weight:600;letter-spacing:-.01em">Section heading h2</div><div class="meta">20 / 600</div></div>
<div class="row"><div class="name">h3 / card</div><div style="font-size:18px;font-weight:500">Card heading h3</div><div class="meta">18 / 500</div></div>
</body></html>
