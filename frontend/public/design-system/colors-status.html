<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-base);font-family:var(--font-sans);color:var(--text-primary)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:90px}
  .lbl{font-weight:600;font-size:14px}
  .name{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
  .hex{font-family:var(--font-mono);font-size:11px;opacity:.7}
  .badges{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid}
</style></head><body>
<div class="row">
  <div class="sw" style="background:rgba(88,166,255,.10);color:#58a6ff;border:1px solid rgba(88,166,255,.30)">
    <div class="lbl">Accent / Info</div><div class="name">--accent</div><div class="hex">#58a6ff</div></div>
  <div class="sw" style="background:rgba(35,134,54,.10);color:#3fb950;border:1px solid rgba(35,134,54,.30)">
    <div class="lbl">Success</div><div class="name">--success</div><div class="hex">#238636</div></div>
  <div class="sw" style="background:rgba(210,153,34,.10);color:#d29922;border:1px solid rgba(210,153,34,.30)">
    <div class="lbl">Warning</div><div class="name">--warning</div><div class="hex">#d29922</div></div>
  <div class="sw" style="background:rgba(218,54,51,.10);color:#da3633;border:1px solid rgba(218,54,51,.30)">
    <div class="lbl">Danger</div><div class="name">--danger</div><div class="hex">#da3633</div></div>
</div>
<div class="badges">
  <span class="badge" style="background:rgba(35,134,54,.10);color:#3fb950;border-color:rgba(35,134,54,.3)">APPROVED</span>
  <span class="badge" style="background:rgba(88,166,255,.10);color:#58a6ff;border-color:rgba(88,166,255,.3)">PENDING</span>
  <span class="badge" style="background:rgba(218,54,51,.10);color:#da3633;border-color:rgba(218,54,51,.3)">FLAGGED</span>
  <span class="badge" style="background:rgba(210,153,34,.10);color:#d29922;border-color:rgba(210,153,34,.3)">UNCERTAIN</span>
</div>
</body></html>
