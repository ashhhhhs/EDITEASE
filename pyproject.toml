[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "editease"
version = "0.1.0"
description = "AI-assisted video clip organization system"
readme = "README.md"
authors = [
    { name="Your Name", email="your.email@example.com" }
]
requires-python = ">=3.9"
dependencies = [
    "flask",
    "pymongo",
    "streamlit",
    "opencv-python",
    "requests",
    "numpy",
    "scenedetect",
    "deepface",
    "celery",
    "redis",
    "flasgger"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.pytest.ini_options]
pythonpath = ["."]
