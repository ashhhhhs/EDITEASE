[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "editease"
version = "0.1.0"
description = "AI-assisted video clip organization system"
readme = "README.md"
authors = [
    { name="Your Name", email="your.email@example.com" }
]
requires-python = ">=3.9"
dependencies = [
    "flask",
    "flask-cors",
    "flask-mail",
    "flasgger",
    "pymongo",
    "python-dotenv",
    "celery",
    "redis",
    "requests",
    "google-auth",
    "cloudinary",
    "numpy",
    "opencv-python",
    "scenedetect<0.7",
    "torch",
    "torchvision",
    "pillow",
    "tqdm",
    "scikit-learn",
    "python-dateutil"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-html",
    "mongomock",
    "black",
    "flake8"
]
# Optional facial-emotion detection (pulls in TensorFlow). Pipeline runs
# without it (emotion_detect.py degrades gracefully). Enable with:
#   pip install -e .[full]
full = [
    "deepface"
]

[tool.setuptools.packages.find]
include = ["api*", "services*", "pipeline*", "database*", "utils*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
